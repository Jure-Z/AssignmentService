version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: assignment_postgres_db
    environment:
      POSTGRES_DB: assignments_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: assignment_service_api
    ports:
      - "7001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=assignments_db;Username=postgres;Password=secretpassword
    depends_on:
      - db
    restart: always

volumes:
  pgdata: